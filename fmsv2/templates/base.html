<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}FMSv2{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">FMSv2</span>
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'monthly' %}active{% endif %}"
             href="{{ url_for('pages.monthly') }}">月次収支</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'graphs' %}active{% endif %}"
             href="{{ url_for('pages.graphs') }}">レポート</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'manage' %}active{% endif %}"
             href="{{ url_for('pages.manage') }}">管理</a>
        </li>
      </ul>
      <span class="navbar-text text-white me-3">{{ current_username }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}" class="d-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
      </form>
    </div>
  </nav>

  <div class="container-fluid">
    {% block content %}{% endblock %}
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto">FMSv2</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
