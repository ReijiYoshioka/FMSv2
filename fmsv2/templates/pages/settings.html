{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">設定</h2>

<div class="row g-4">
    <div class="col-lg-5">
        <div class="card shadow-sm" id="account">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0"><i class="fas fa-key me-2"></i>パスワード変更</h5>
            </div>
            <div class="card-body">
                <form id="passwordForm" novalidate>
                    <div class="mb-2">
                        <label class="form-label small" for="curPassword">現在のパスワード</label>
                        <input type="password" id="curPassword" class="form-control form-control-sm" autocomplete="current-password" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="newPassword">新しいパスワード</label>
                        <input type="password" id="newPassword" class="form-control form-control-sm" minlength="8" autocomplete="new-password" required>
                        <div class="form-text">8文字以上</div>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary" id="changePasswordBtn">変更する</button>
                    <div id="passwordResult" class="small mt-2"></div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
