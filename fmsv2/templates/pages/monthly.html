{% extends "base.html" %}
{% block title %}月次収支 - FMSv2{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3 gap-2">
  <button id="prevMonthBtn" class="btn btn-outline-secondary">&laquo;</button>
  <input type="month" id="monthInput" class="form-control" style="max-width: 200px;">
  <button id="nextMonthBtn" class="btn btn-outline-secondary">&raquo;</button>
  <button id="newTransactionBtn" class="btn btn-primary ms-auto" data-bs-toggle="modal"
          data-bs-target="#transactionModal">取引を登録</button>
</div>

<div class="row mb-3">
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="text-muted">収入</div>
      <div class="fs-4" id="incomeTotal">¥0</div>
      <div class="small text-muted" id="incomeDelta"></div>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="text-muted">支出</div>
      <div class="fs-4" id="expenseTotal">¥0</div>
      <div class="small text-muted" id="expenseDelta"></div>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <div class="text-muted">収支差額</div>
      <div class="fs-4" id="balanceTotal">¥0</div>
      <div class="small text-muted" id="balanceDelta"></div>
    </div></div>
  </div>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card mb-3"><div class="card-body">
      <form id="filterForm" class="row g-2 mb-3">
        <div class="col-md-4"><input type="text" class="form-control" name="q" placeholder="キーワード"></div>
        <div class="col-md-2">
          <select class="form-select" name="type">
            <option value="">種別</option>
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>
        </div>
        <div class="col-md-3"><select class="form-select" name="category_id"><option value="">カテゴリー</option></select></div>
        <div class="col-md-1"><input type="number" class="form-control" name="min" placeholder="最小額"></div>
        <div class="col-md-1"><input type="number" class="form-control" name="max" placeholder="最大額"></div>
        <div class="col-md-1"><button type="submit" class="btn btn-secondary w-100">検索</button></div>
      </form>
      <a id="csvExportLink" class="btn btn-outline-secondary btn-sm mb-2" href="#">CSVエクスポート</a>
      <table class="table table-hover">
        <thead><tr><th>日付</th><th>内容</th><th>カテゴリー</th><th>決済手段</th><th class="text-end">金額</th></tr></thead>
        <tbody id="transactionList"></tbody>
      </table>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card mb-3"><div class="card-body">
      <h6>カテゴリー別支出</h6>
      <canvas id="categoryChart"></canvas>
    </div></div>
    <div class="card mb-3"><div class="card-body">
      <h6>決済手段別支出</h6>
      <canvas id="paymentChart"></canvas>
    </div></div>
    <div class="card"><div class="card-body">
      <h6>予算進捗</h6>
      <div id="budgetProgress"></div>
    </div></div>
  </div>
</div>

<div class="modal fade" id="transactionModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="transactionForm">
        <div class="modal-header">
          <h5 class="modal-title">取引</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="row g-2 mb-2">
            <div class="col-md-6"><label>日付<input type="date" class="form-control" name="date" required></label></div>
            <div class="col-md-6">
              <label>種別
                <select class="form-select" name="type">
                  <option value="expense">支出</option>
                  <option value="income">収入</option>
                </select>
              </label>
            </div>
          </div>
          <div class="mb-2"><label>内容<input type="text" class="form-control" name="description" required></label></div>
          <div class="row g-2 mb-2">
            <div class="col-md-6"><label>決済手段<select class="form-select" name="payment_method_id"></select></label></div>
            <div class="col-md-6"><label>カテゴリー<select class="form-select" name="category_id"></select></label></div>
          </div>
          <div class="mb-2">
            <label>金額<input type="number" class="form-control" name="amount" min="0" required></label>
          </div>
          <div class="mb-2">
            <div class="d-flex justify-content-between">
              <label class="form-label mb-0">内訳</label>
              <button type="button" id="addItemBtn" class="btn btn-sm btn-outline-secondary">+ 内訳を追加</button>
            </div>
            <div id="itemRows"></div>
          </div>
          <div class="mb-2"><label>備考<textarea class="form-control" name="memo"></textarea></label></div>
        </div>
        <div class="modal-footer">
          <button type="button" id="deleteTransactionBtn" class="btn btn-danger me-auto d-none">削除</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/monthly.js') }}"></script>
{% endblock %}
