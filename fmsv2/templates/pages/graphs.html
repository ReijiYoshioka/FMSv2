{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">レポート・分析</h2>

<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <h4 class="mb-0"><i class="fas fa-calendar-alt me-2 text-primary"></i>年次レポート</h4>
    <div style="width: auto;">
        <label class="form-label mb-0 me-2 small text-muted" for="reportYearSelector">対象年</label>
        <select id="reportYearSelector" class="form-select d-inline-block" style="width: auto;"></select>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card bg-success text-white h-100 shadow-sm">
            <div class="card-body">
                <h6 class="card-title opacity-75">年間収入</h6>
                <h3 class="card-text fw-bold" id="annualIncome">¥0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-danger text-white h-100 shadow-sm">
            <div class="card-body">
                <h6 class="card-title opacity-75">年間支出</h6>
                <h3 class="card-text fw-bold" id="annualExpense">¥0</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white h-100 shadow-sm" id="annualBalanceCard">
            <div class="card-body">
                <h6 class="card-title opacity-75">年間収支差額</h6>
                <h3 class="card-text fw-bold" id="annualBalance">¥0</h3>
            </div>
        </div>
    </div>
</div>

<div class="row g-4 mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h5 class="mb-0">年間カテゴリー別支出</h5>
            </div>
            <div class="card-body position-relative chart-box" style="min-height: 320px;">
                <canvas id="annualCategoryChart" role="img" aria-label="年間のカテゴリー別支出の円グラフ"></canvas>
                <div class="chart-empty text-center text-muted position-absolute top-50 start-50 translate-middle d-none">
                    <i class="fas fa-inbox fa-2x mb-2 opacity-25 d-block"></i>この年のデータはありません
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h5 class="mb-0">年間決済手段別利用</h5>
            </div>
            <div class="card-body position-relative chart-box" style="min-height: 320px;">
                <canvas id="annualPaymentChart" role="img" aria-label="年間の決済手段別支出の円グラフ"></canvas>
                <div class="chart-empty text-center text-muted position-absolute top-50 start-50 translate-middle d-none">
                    <i class="fas fa-inbox fa-2x mb-2 opacity-25 d-block"></i>この年のデータはありません
                </div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">月別の収支推移</h5>
            </div>
            <div class="card-body position-relative chart-box">
                <canvas id="trendChart" role="img" aria-label="年間の収入と支出の推移を示す棒グラフ" style="max-height: 400px;"></canvas>
                <div class="chart-empty text-center text-muted position-absolute top-50 start-50 translate-middle d-none">
                    <i class="fas fa-inbox fa-2x mb-2 opacity-25 d-block"></i>この年のデータはありません
                </div>
            </div>
        </div>
    </div>
</div>

<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <h4 class="mb-0"><i class="fas fa-calendar-day me-2 text-primary"></i>月次レポート</h4>
    <div class="input-group month-nav" style="width: auto;">
        <button class="btn btn-outline-secondary" type="button" id="reportPrevMonthBtn" aria-label="前の月へ"><i class="fas fa-chevron-left"></i></button>
        <input type="month" id="reportMonthSelector" class="form-control" aria-label="対象月" style="max-width: 160px;">
        <button class="btn btn-outline-secondary" type="button" id="reportNextMonthBtn" aria-label="次の月へ"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h5 class="mb-0">カテゴリー別支出 (対象月)</h5>
            </div>
            <div class="card-body position-relative chart-box" style="min-height: 300px;">
                <canvas id="categoryChart" role="img" aria-label="カテゴリー別支出の円グラフ"></canvas>
                <div class="chart-empty text-center text-muted position-absolute top-50 start-50 translate-middle d-none">
                    <i class="fas fa-inbox fa-2x mb-2 opacity-25 d-block"></i>データがありません
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white">
                <h5 class="mb-0">決済手段別利用 (対象月)</h5>
            </div>
            <div class="card-body position-relative chart-box" style="min-height: 300px;">
                <canvas id="paymentChart" role="img" aria-label="決済手段別支出の円グラフ"></canvas>
                <div class="chart-empty text-center text-muted position-absolute top-50 start-50 translate-middle d-none">
                    <i class="fas fa-inbox fa-2x mb-2 opacity-25 d-block"></i>データがありません
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/graphs.js') }}"></script>
{% endblock %}
