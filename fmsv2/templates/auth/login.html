<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ログイン - FMSv2</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>FMSv2 ログイン</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>ユーザー名 <input type="text" name="username" required></label>
      <label>パスワード <input type="password" name="password" required></label>
      <button type="submit">ログイン</button>
    </form>
    <p><a href="{{ url_for('auth.register') }}">新規登録</a></p>
  </div>
</body>
</html>
