<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMS</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="card card-login">
        <div class="brand-header brand-header--blue">
            <h1><i class="fas fa-wallet me-2"></i>FMS</h1>
            <p class="mb-0 opacity-75">Financial Management System</p>
        </div>
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">ログイン</h4>

            {% if error %}
                <div class="alert alert-danger py-2 small"><i class="fas fa-exclamation-circle me-1"></i>{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label class="form-label" for="username">ユーザーID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="username" class="form-control" placeholder="ユーザーID" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">パスワード</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="パスワード" required>
                    </div>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">ログイン</button>
                </div>
                <div class="text-center">
                    <a href="{{ url_for('auth.register') }}" class="small text-decoration-none">アカウントをお持ちでない方はこちら (登録)</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
