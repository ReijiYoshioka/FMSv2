<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>新規登録 - FMSv2</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>FMSv2 新規登録</h1>
    {% if success %}
      <p class="success">登録が完了しました。<a href="{{ url_for('auth.login') }}">ログイン</a>してください。</p>
    {% else %}
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>ユーザー名 <input type="text" name="username" required></label>
        <label>パスワード <input type="password" name="password" required></label>
        <button type="submit">登録</button>
      </form>
    {% endif %}
    <p><a href="{{ url_for('auth.login') }}">ログインへ戻る</a></p>
  </div>
</body>
</html>
